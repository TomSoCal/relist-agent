name: Build Relist Agent Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build for Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow
      - name: Build EXE
        run: |
          pyinstaller --windowed --onefile --name "Relist Agent" --icon ERA_Icon.ico --distpath DISTRIBUTION --add-data "licenses.json;." --add-data "ERA_Icon.png;." --add-data "ERA_Logo.png;." --add-data "update_checker.py;." --add-data "version.json;." --add-data "scheduler_windows.py;." --hidden-import=tkinter --hidden-import=PIL gui_app.py
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: Relist-Agent-Windows-Beta-1.0.0
          path: DISTRIBUTION/

  build-macos:
    name: Build for macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow
      - name: Build App
        run: |
          pyinstaller --windowed --onefile --name "Relist Agent" --icon ERA_Icon.ico --distpath DISTRIBUTION --add-data "licenses.json:." --add-data "ERA_Icon.png:." --add-data "ERA_Logo.png:." --add-data "update_checker.py:." --add-data "version.json:." --add-data "scheduler_macos.py:." --hidden-import=tkinter --hidden-import=PIL gui_app.py
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: Relist-Agent-MAC-Beta-1.0.0
          path: DISTRIBUTION/

  build-linux:
    name: Build for Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow
      - name: Build binary
        run: |
          pyinstaller --windowed --onefile --name "relist-agent" --distpath DISTRIBUTION --add-data "licenses.json:." --add-data "ERA_Icon.png:." --add-data "ERA_Logo.png:." --add-data "update_checker.py:." --add-data "version.json:." --add-data "scheduler_linux.py:." --hidden-import=tkinter --hidden-import=PIL gui_app.py
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: Relist-Agent-linux-Beta-1.0.0
          path: DISTRIBUTION/
